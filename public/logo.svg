<svg xmlns="http://www.w3.org/2000/svg" viewBox="180 120 775 520" role="img" aria-labelledby="logo-title">
  <title id="logo-title">Urban Tracker</title>
  <defs>
    <!-- Background Glow Filter -->
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="intense-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="bg-plate-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020914" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#041224" stop-opacity="0.96" />
    </linearGradient>
    <linearGradient id="bldg-back" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#123b61" />
      <stop offset="100%" stop-color="#071b2e" />
    </linearGradient>
    <linearGradient id="bldg-mid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#165185" />
      <stop offset="100%" stop-color="#092542" />
    </linearGradient>
    <linearGradient id="bldg-fore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c66a6" />
      <stop offset="100%" stop-color="#0c3259" />
    </linearGradient>
    <linearGradient id="spire-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f6ff" />
      <stop offset="35%" stop-color="#2482c4" />
      <stop offset="100%" stop-color="#0e3c66" />
    </linearGradient>
    <linearGradient id="radar-sweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f6ff" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#00aaff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#00f6ff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="grid-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f6ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00f6ff" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- ========================================== -->
  <!-- 1. FIXED OUTER HUD APERTURE & BRACKETS     -->
  <!-- ========================================== -->
  <!-- Semi-translucent HUD Backing Plate -->
  <path d="M 235 145 L 900 145 L 945 190 L 945 570 L 900 615 L 235 615 L 190 570 L 190 190 Z"
        fill="url(#bg-plate-grad)" stroke="#1a4d78" stroke-width="2" />

  <!-- Outer HUD Corner Framing Brackets -->
  <path d="M 225 185 L 225 145 L 265 145" stroke="#00f6ff" stroke-width="4.5" stroke-linecap="round" fill="none" filter="url(#cyan-glow)" />
  <path d="M 910 145 L 870 145 M 910 145 L 910 185" stroke="#00f6ff" stroke-width="4.5" stroke-linecap="round" fill="none" filter="url(#cyan-glow)" />
  <path d="M 225 575 L 225 615 L 265 615" stroke="#00f6ff" stroke-width="4.5" stroke-linecap="round" fill="none" filter="url(#cyan-glow)" />
  <path d="M 910 575 L 910 615 L 870 615" stroke="#00f6ff" stroke-width="4.5" stroke-linecap="round" fill="none" filter="url(#cyan-glow)" />

  <!-- Outer HUD Circular Track (Static) -->
  <circle cx="567.5" cy="385" r="215" fill="none" stroke="#1d5c8f" stroke-width="2" stroke-dasharray="6 8" opacity="0.6" />
  <circle cx="567.5" cy="385" r="225" fill="none" stroke="#00f6ff" stroke-width="1.5" stroke-dasharray="24 36" opacity="0.4" />

  <!-- Quadrant Marker Lines -->
  <line x1="567.5" y1="130" x2="567.5" y2="152" stroke="#00f6ff" stroke-width="2.5" />
  <line x1="567.5" y1="605" x2="567.5" y2="627" stroke="#00f6ff" stroke-width="2.5" />
  <line x1="332" y1="385" x2="355" y2="385" stroke="#00f6ff" stroke-width="2.5" />
  <line x1="780" y1="385" x2="803" y2="385" stroke="#00f6ff" stroke-width="2.5" />

  <!-- HUD Tactical Telemetry Callouts -->
  <text x="245" y="172" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" font-weight="700" fill="#00f6ff" letter-spacing="2">URBAN METRO GRID</text>
  <text x="735" y="172" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" font-weight="700" fill="#48b" letter-spacing="2">SYS: SURVEILLANCE</text>
  <text x="245" y="595" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10" font-weight="600" fill="#48b" letter-spacing="1.5">URBAN TRACKER INTEL</text>
  <text x="745" y="595" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10" font-weight="700" fill="#00f6ff" letter-spacing="1.5">28.61°N / 77.20°E</text>

  <!-- ========================================== -->
  <!-- 2. CITY SKYLINE CORE (#globe)              -->
  <!-- ========================================== -->
  <g id="globe">
    <!-- 3D Perspective Digital Ground Grid -->
    <g>
      <!-- Horizon baseline with high-contrast cyan neon glow -->
      <line x1="250" y1="510" x2="885" y2="510" stroke="#00f6ff" stroke-width="2.5" filter="url(#cyan-glow)" />
      <!-- Perspective street radials converging to skyline base -->
      <line x1="567.5" y1="510" x2="280" y2="578" stroke="url(#grid-fade)" stroke-width="2" />
      <line x1="567.5" y1="510" x2="395" y2="578" stroke="url(#grid-fade)" stroke-width="2" />
      <line x1="567.5" y1="510" x2="495" y2="578" stroke="url(#grid-fade)" stroke-width="2" />
      <line x1="567.5" y1="510" x2="567.5" y2="578" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="6 4" filter="url(#cyan-glow)" />
      <line x1="567.5" y1="510" x2="640" y2="578" stroke="url(#grid-fade)" stroke-width="2" />
      <line x1="567.5" y1="510" x2="740" y2="578" stroke="url(#grid-fade)" stroke-width="2" />
      <line x1="567.5" y1="510" x2="855" y2="578" stroke="url(#grid-fade)" stroke-width="2" />
      <!-- Cross street rungs -->
      <line x1="320" y1="528" x2="815" y2="528" stroke="#00f6ff" stroke-width="1.2" opacity="0.6" />
      <line x1="295" y1="550" x2="840" y2="550" stroke="#00f6ff" stroke-width="1.5" opacity="0.45" />
      <line x1="270" y1="574" x2="865" y2="574" stroke="#00f6ff" stroke-width="1.8" opacity="0.3" />
    </g>

    <!-- BACK LAYER BUILDINGS (Deep Background Density) -->
    <g opacity="0.9">
      <!-- Far Left Silhouette -->
      <rect x="325" y="380" width="42" height="130" fill="url(#bldg-back)" stroke="#1e6b9c" stroke-width="1.5" />
      <!-- Mid-Left High Silhouette -->
      <polygon points="375,325 420,325 420,510 375,510" fill="url(#bldg-back)" stroke="#1e6b9c" stroke-width="1.5" />
      <line x1="397.5" y1="325" x2="397.5" y2="290" stroke="#00f6ff" stroke-width="1.8" />
      <!-- Center-Left Silhouette -->
      <polygon points="430,275 472,275 472,510 430,510" fill="url(#bldg-back)" stroke="#1e6b9c" stroke-width="1.5" />
      <polygon points="480,248 525,248 525,510 480,510" fill="url(#bldg-back)" stroke="#1e6b9c" stroke-width="1.5" />
      <!-- Center-Right Silhouette -->
      <polygon points="610,258 655,258 655,510 610,510" fill="url(#bldg-back)" stroke="#1e6b9c" stroke-width="1.5" />
      <line x1="632.5" y1="258" x2="632.5" y2="225" stroke="#00f6ff" stroke-width="1.8" />
      <!-- Mid-Right Silhouette -->
      <polygon points="665,302 705,302 705,510 665,510" fill="url(#bldg-back)" stroke="#1e6b9c" stroke-width="1.5" />
      <!-- Far Right Silhouette -->
      <rect x="748" y="370" width="48" height="140" fill="url(#bldg-back)" stroke="#1e6b9c" stroke-width="1.5" />
    </g>

    <!-- MID LAYER BUILDINGS (Detailed High-Rise Architecture) -->
    <g>
      <!-- Building Left A: Stepped Setback High-Rise -->
      <polygon points="345,415 385,415 385,510 345,510" fill="url(#bldg-mid)" stroke="#00f6ff" stroke-width="2" />
      <line x1="355" y1="428" x2="355" y2="502" stroke="#00f6ff" stroke-width="2.2" stroke-dasharray="4 4" />
      <line x1="365" y1="428" x2="365" y2="502" stroke="#ffffff" stroke-width="2.2" stroke-dasharray="4 4" />
      <line x1="375" y1="428" x2="375" y2="502" stroke="#00f6ff" stroke-width="2.2" stroke-dasharray="4 4" />

      <!-- Building Left B: Angled Crown Skyscraper with Diagonal Bracing -->
      <polygon points="395,342 448,302 448,510 395,510" fill="url(#bldg-mid)" stroke="#00f6ff" stroke-width="2.2" />
      <line x1="448" y1="302" x2="448" y2="258" stroke="#ffffff" stroke-width="2.5" filter="url(#cyan-glow)" />
      <circle cx="448" cy="258" r="3" fill="#00f6ff" filter="url(#intense-glow)" />
      <!-- Luminous Diagonal Chevron Braces -->
      <line x1="400" y1="350" x2="442" y2="400" stroke="#00f6ff" stroke-width="1.8" opacity="0.8" />
      <line x1="400" y1="400" x2="442" y2="350" stroke="#00f6ff" stroke-width="1.8" opacity="0.8" />
      <line x1="400" y1="420" x2="442" y2="470" stroke="#00f6ff" stroke-width="1.8" opacity="0.8" />
      <line x1="400" y1="470" x2="442" y2="420" stroke="#00f6ff" stroke-width="1.8" opacity="0.8" />

      <!-- Building Left C: Tiered Corporate Tower -->
      <polygon points="455,360 465,340 498,340 508,360 508,510 455,510" fill="url(#bldg-fore)" stroke="#00f6ff" stroke-width="2.2" />
      <!-- Horizontal Window Floor Bands -->
      <line x1="462" y1="375" x2="501" y2="375" stroke="#00f6ff" stroke-width="2" />
      <line x1="462" y1="395" x2="501" y2="395" stroke="#ffffff" stroke-width="2" />
      <line x1="462" y1="415" x2="501" y2="415" stroke="#00f6ff" stroke-width="2" />
      <line x1="462" y1="435" x2="501" y2="435" stroke="#00f6ff" stroke-width="2" />
      <line x1="462" y1="455" x2="501" y2="455" stroke="#ffffff" stroke-width="2" />
      <line x1="462" y1="475" x2="501" y2="475" stroke="#00f6ff" stroke-width="2" />
      <line x1="462" y1="495" x2="501" y2="495" stroke="#00f6ff" stroke-width="2" />

      <!-- Building Right C: Curved Glass Tower with Rooftop Helipad -->
      <polygon points="628,335 678,335 678,510 628,510" fill="url(#bldg-fore)" stroke="#00f6ff" stroke-width="2.2" />
      <!-- Helipad Landing Ring -->
      <ellipse cx="653" cy="335" rx="18" ry="6" fill="#0c3259" stroke="#00f6ff" stroke-width="2" />
      <line x1="647" y1="335" x2="659" y2="335" stroke="#ffd166" stroke-width="2.5" />
      <!-- Vertical Facade Light Mullions -->
      <line x1="637" y1="350" x2="637" y2="502" stroke="#00f6ff" stroke-width="2.2" stroke-dasharray="4 4" />
      <line x1="647" y1="350" x2="647" y2="502" stroke="#ffffff" stroke-width="2.2" stroke-dasharray="4 4" />
      <line x1="658" y1="350" x2="658" y2="502" stroke="#ffffff" stroke-width="2.2" stroke-dasharray="4 4" />
      <line x1="669" y1="350" x2="669" y2="502" stroke="#00f6ff" stroke-width="2.2" stroke-dasharray="4 4" />

      <!-- Building Right B: Twin Spires Tower with Skybridge -->
      <polygon points="685,375 728,375 728,510 685,510" fill="url(#bldg-mid)" stroke="#00f6ff" stroke-width="2.2" />
      <line x1="693" y1="375" x2="693" y2="330" stroke="#00f6ff" stroke-width="2.5" />
      <line x1="720" y1="375" x2="720" y2="330" stroke="#00f6ff" stroke-width="2.5" />
      <!-- Skybridge Connection -->
      <rect x="693" y="348" width="27" height="6" fill="#00f6ff" opacity="0.9" />
      <!-- Windows -->
      <line x1="692" y1="392" x2="721" y2="392" stroke="#00f6ff" stroke-width="1.8" />
      <line x1="692" y1="414" x2="721" y2="414" stroke="#ffffff" stroke-width="1.8" />
      <line x1="692" y1="436" x2="721" y2="436" stroke="#00f6ff" stroke-width="1.8" />
      <line x1="692" y1="458" x2="721" y2="458" stroke="#ffffff" stroke-width="1.8" />
      <line x1="692" y1="480" x2="721" y2="480" stroke="#00f6ff" stroke-width="1.8" />
      <line x1="692" y1="500" x2="721" y2="500" stroke="#00f6ff" stroke-width="1.8" />

      <!-- Building Right A: Tech Complex -->
      <polygon points="735,415 775,415 775,510 735,510" fill="url(#bldg-mid)" stroke="#00f6ff" stroke-width="2" />
      <line x1="743" y1="432" x2="767" y2="432" stroke="#00f6ff" stroke-width="1.8" />
      <line x1="743" y1="452" x2="767" y2="452" stroke="#ffffff" stroke-width="1.8" />
      <line x1="743" y1="472" x2="767" y2="472" stroke="#00f6ff" stroke-width="1.8" />
      <line x1="743" y1="492" x2="767" y2="492" stroke="#00f6ff" stroke-width="1.8" />
    </g>

    <!-- FOREGROUND HERO BUILDING: THE CENTRAL SUPERTALL METROPOLIS SPIRE -->
    <g>
      <!-- Base Tower Section (Y: 345 to 510) -->
      <polygon points="522,345 613,345 613,510 522,510" fill="url(#bldg-fore)" stroke="#00f6ff" stroke-width="2.8" />
      <!-- Mid-Tier Stepped Taper (Y: 265 to 345) -->
      <polygon points="536,265 599,265 606,345 529,345" fill="url(#spire-grad)" stroke="#00f6ff" stroke-width="2.8" />
      <!-- Crown Pyramidal Apex (Y: 205 to 265) -->
      <polygon points="567.5,200 592,265 543,265" fill="url(#spire-grad)" stroke="#00f6ff" stroke-width="2.8" />

      <!-- Central Transmission Mast / Antenna Spire (Y: 152 to 200) -->
      <line x1="567.5" y1="200" x2="567.5" y2="152" stroke="#ffffff" stroke-width="3.5" filter="url(#cyan-glow)" />
      <!-- Warning Beacon & Telemetry Transponder -->
      <circle cx="567.5" cy="152" r="5" fill="#00f6ff" filter="url(#intense-glow)" />
      <circle cx="567.5" cy="152" r="2.2" fill="#ffffff" />
      <!-- Ruby red satellite sync beacon -->
      <circle cx="567.5" cy="164" r="2" fill="#ff3b30" filter="url(#intense-glow)" />

      <!-- Iconic Luminous Core Data Spine -->
      <line x1="567.5" y1="205" x2="567.5" y2="505" stroke="#00f6ff" stroke-width="3" filter="url(#cyan-glow)" />
      <line x1="567.5" y1="205" x2="567.5" y2="505" stroke="#ffffff" stroke-width="1.2" />

      <!-- High-Density Cyber Window Columns -->
      <line x1="542" y1="360" x2="542" y2="502" stroke="#00f6ff" stroke-width="2.5" stroke-dasharray="5 4" />
      <line x1="553" y1="360" x2="553" y2="502" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="5 4" />
      <line x1="582" y1="360" x2="582" y2="502" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="5 4" />
      <line x1="593" y1="360" x2="593" y2="502" stroke="#00f6ff" stroke-width="2.5" stroke-dasharray="5 4" />

      <!-- Crown horizontal decorative rings -->
      <line x1="542" y1="285" x2="593" y2="285" stroke="#00f6ff" stroke-width="2.2" />
      <line x1="546" y1="308" x2="589" y2="308" stroke="#00f6ff" stroke-width="2.2" />
      <line x1="550" y1="330" x2="585" y2="330" stroke="#00f6ff" stroke-width="2.2" />
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 3. URBAN TRACKING HUD & RADAR CAGE         -->
  <!--    (#globe_cage - moves with gaze)         -->
  <!-- ========================================== -->
  <g id="globe_cage">
    <!-- Concentric Radar Range Tracking Rings (Centered at 567.5, 345) -->
    <!-- Inner Range Ring -->
    <circle cx="567.5" cy="345" r="105" fill="none" stroke="#00f6ff" stroke-width="1.8" stroke-dasharray="6 6" opacity="0.6" />
    <!-- Mid Range Ring with Cardinal Ticks -->
    <circle cx="567.5" cy="345" r="175" fill="none" stroke="#00f6ff" stroke-width="2.2" stroke-dasharray="14 18" opacity="0.75" />
    <path d="M 567.5 163 L 567.5 175 M 567.5 510 L 567.5 522 M 385 345 L 397 345 M 738 345 L 750 345"
          stroke="#00f6ff" stroke-width="2.5" />

    <!-- Radar Sweep Wedge Beam -->
    <path d="M 567.5 345 L 410 220 A 215 215 0 0 1 567.5 130 Z" fill="url(#radar-sweep)" opacity="0.6" />

    <!-- Spire Radio / Satellite Transmission Waves -->
    <path d="M 552 142 A 18 18 0 0 1 583 142" fill="none" stroke="#00f6ff" stroke-width="2.5" stroke-linecap="round" filter="url(#cyan-glow)" />
    <path d="M 542 132 A 30 30 0 0 1 593 132" fill="none" stroke="#00f6ff" stroke-width="2.2" stroke-linecap="round" opacity="0.8" />
    <path d="M 532 122 A 42 42 0 0 1 603 122" fill="none" stroke="#00f6ff" stroke-width="1.8" stroke-linecap="round" opacity="0.5" />

    <!-- TARGET LOCK 01: Central Command Spire -->
    <g transform="translate(567.5, 238)">
      <path d="M -24 -15 L -30 -15 L -30 -7" fill="none" stroke="#00f6ff" stroke-width="2.5" />
      <path d="M 24 -15 L 30 -15 L 30 -7" fill="none" stroke="#00f6ff" stroke-width="2.5" />
      <path d="M -24 15 L -30 15 L -30 7" fill="none" stroke="#00f6ff" stroke-width="2.5" />
      <path d="M 24 15 L 30 15 L 30 7" fill="none" stroke="#00f6ff" stroke-width="2.5" />
      <!-- Target lock crosshair dot -->
      <circle cx="0" cy="0" r="3.5" fill="#ff3b30" filter="url(#intense-glow)" />
      <circle cx="0" cy="0" r="1.8" fill="#ffffff" />
      <text x="36" y="4" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10" font-weight="700" fill="#00f6ff" letter-spacing="1">HUB-01 [LOCKED]</text>
    </g>

    <!-- TARGET LOCK 02: Aerial Flight / Drone in Urban Airspace -->
    <g transform="translate(370, 230)">
      <!-- Tactical Aircraft Silhouette -->
      <polygon points="0,-9 9,7 0,3 -9,7" fill="#ffffff" stroke="#00f6ff" stroke-width="1.5" filter="url(#cyan-glow)" />
      <!-- Trailing Flight Track Vector -->
      <line x1="-25" y1="-18" x2="-5" y2="-4" stroke="#00f6ff" stroke-width="2" stroke-dasharray="4 3" opacity="0.85" />
      <!-- Target Tracking Box -->
      <path d="M -14 -14 L -18 -14 L -18 -7" fill="none" stroke="#00f6ff" stroke-width="2" />
      <path d="M 14 -14 L 18 -14 L 18 -7" fill="none" stroke="#00f6ff" stroke-width="2" />
      <path d="M -14 14 L -18 14 L -18 7" fill="none" stroke="#00f6ff" stroke-width="2" />
      <path d="M 14 14 L 18 14 L 18 7" fill="none" stroke="#00f6ff" stroke-width="2" />
      <text x="22" y="-3" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="9" font-weight="700" fill="#ffffff">FLIGHT-402</text>
      <text x="22" y="9" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="9" font-weight="700" fill="#00f6ff">ALT: 3200M</text>
    </g>

    <!-- TARGET LOCK 03: East Urban Surveillance Node -->
    <g transform="translate(715, 240)">
      <circle cx="0" cy="0" r="14" fill="none" stroke="#00f6ff" stroke-width="1.8" stroke-dasharray="4 4" />
      <line x1="-18" y1="0" x2="18" y2="0" stroke="#00f6ff" stroke-width="1.5" />
      <line x1="0" y1="-18" x2="0" y2="18" stroke="#00f6ff" stroke-width="1.5" />
      <circle cx="0" cy="0" r="2" fill="#ffd166" />
      <text x="20" y="4" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="9" font-weight="700" fill="#00f6ff">SECTOR-E // SCAN</text>
    </g>
  </g>
</svg>